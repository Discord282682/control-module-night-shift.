PROJECT_ARCHIVE
          tr -d '\n\r ' < project.zip.b64 | base64 --decode > project.zip
          unzip -q project.zip
          ROOT=$(find . -maxdepth 3 -type f -name gradlew -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Could not find Gradle wrapper"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlModuleNightShift-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

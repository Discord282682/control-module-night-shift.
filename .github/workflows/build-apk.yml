          base64 --decode project.zip.b64 > project.zip
          unzip -q project.zip
          mv fixedapp android-project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlModuleNightShift-latest-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

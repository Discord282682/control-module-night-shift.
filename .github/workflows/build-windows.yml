          [IO.File]::WriteAllBytes("project.zip", [Convert]::FromBase64String($payload))
          Expand-Archive -Path "project.zip" -DestinationPath "." -Force
          if (!(Test-Path "ControlModuleNightShiftElectron_Fixed/package.json")) {
            throw "The embedded Electron project was not restored correctly."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ControlModuleNightShiftElectron_Fixed
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate launcher files
        working-directory: ControlModuleNightShiftElectron_Fixed
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          if (!(Test-Path "app/index.html")) { throw "app/index.html is missing" }

      - name: Build portable EXE
        working-directory: ControlModuleNightShiftElectron_Fixed
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:portable
          if (!(Test-Path "dist/Control-Module-Night-Shift-Portable-1.0.1-x64.exe")) {
            Get-ChildItem -Recurse dist | Format-Table FullName, Length
            throw "Portable EXE was not created."
          }

      - name: Build installer EXE
        continue-on-error: true
        working-directory: ControlModuleNightShiftElectron_Fixed
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:installer

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: ControlModuleNightShift-Windows-EXE-Fixed
          path: |
            ControlModuleNightShiftElectron_Fixed/dist/*.exe
            ControlModuleNightShiftElectron_Fixed/dist/*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ControlModuleNightShift-build-diagnostics
          path: |
            ControlModuleNightShiftElectron_Fixed/package.json
            ControlModuleNightShiftElectron_Fixed/main.js
            ControlModuleNightShiftElectron_Fixed/preload.js
            ControlModuleNightShiftElectron_Fixed/dist/**
          if-no-files-found: ignore
          retention-days: 7

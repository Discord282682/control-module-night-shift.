'@
          [IO.File]::WriteAllBytes("project.zip", [Convert]::FromBase64String(($payload -replace "\s", "")))
          Expand-Archive -Path project.zip -DestinationPath . -Force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ControlModuleNightShiftElectron
        run: npm install

      - name: Build installer and portable launcher
        working-directory: ControlModuleNightShiftElectron
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: ControlModuleNightShift-Windows-EXE
          path: ControlModuleNightShiftElectron/dist/*.exe
          if-no-files-found: error
